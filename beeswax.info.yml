name: 'Bee, honey, and wax inspired theme'
type: theme
'base theme': false
libraries:
  - beeswax/global
logo: logo-dark.svg
description: 'A customized version of Mercury with a sprinkling of Bee, honey, and wax'
core_version_requirement: ^11
generator: 'mercury:1.0.5'
regions:
  content: Content
  header: Header
  footer: Footer
dependencies:
  - 'cva:cva'

# Tom Select for the HiveLog table filters. hivelog/filter_form is
# attached directly by each HivelogXFilterForm::buildForm(), so
# libraries-extend fires and the widget loads only where a filter form
# renders (the apiary / hive canonical pages, the full calendar).
libraries-extend:
  hivelog/filter_form:
    - beeswax/hivelog-filter-select
