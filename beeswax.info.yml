name: 'Bee, honey, and wax inspired theme'
type: theme
'base theme': false
libraries:
  - beeswax/global
logo: logo-dark.svg
description: 'A customized version of Mercury with a sprinkling of Bee, honey, and wax'
core_version_requirement: ^11
version: '1.0.0'
generator: 'mercury:1.0.5'
regions:
  content: Content
  header: Header
  footer: Footer
dependencies:
  - 'cva:cva'

# Tom Select for HiveLog <select>s. Both libraries are attached directly
# by the forms that own them — hivelog/filter_form by each
# HivelogXFilterForm::buildForm() (apiary / hive canonical pages, the
# full calendar), hivelog/forms by each entity add/edit form — so
# libraries-extend fires and the widget loads only where one of those
# renders. lib/hivelog-select.js scopes to `.hivelog-filter-form select`
# and `.hivelog-entity-form select`.
libraries-extend:
  hivelog/filter_form:
    - beeswax/hivelog-select
  hivelog/forms:
    - beeswax/hivelog-select
