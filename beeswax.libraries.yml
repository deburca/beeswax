global:
  version: VERSION
  css:
    theme:
      src/fonts.css:
        preprocess: false
      build/main.min.css:
        # Avoid attempting to re-minify main.min.css. Also ensure it's served in
        # its own right so that browsers only download it once, instead of via
        # aggregates where it may get duplicated across files.
        preprocess: false
        minified: true
      src/theme.css:
        preprocess: false
      # HiveLog skin — the Fraunces / IBM Plex + beeswax / pine identity for
      # the hivelog module's markup (ADR-0060, task 0061). Loaded globally
      # rather than via `libraries-extend`: that only fires for libraries a
      # controller attaches directly (the dashboard does), but the entity
      # list pages pull hivelog's CSS only transitively through the
      # hivelog:entity-table SDC's dependencies, where libraries-extend
      # does not reach. Every selector here is `.hivelog-*`-scoped, and it
      # sits in the `theme` CSS group so it always lands after the
      # module's own `component`-group CSS.
      src/hivelog.css:
        preprocess: false

messages:
  version: VERSION
  js:
    lib/messages.js: {}
  dependencies:
    - core/drupal
    - core/once

motion:
  js:
    build/motion.js: { minified: true }
  dependencies:
    - core/once

# Upgrades the HiveLog table-filter <select>s to Tom Select so the option
# list can be themed (a native <select> popup is browser chrome). Attached
# via `libraries-extend` on hivelog/filter_form in beeswax.info.yml, so it
# loads only on pages with a HiveLog filter form. Tom Select v2.4.3,
# Apache-2.0, vendored under lib/vendor/tom-select/.
hivelog-filter-select:
  version: VERSION
  css:
    theme:
      lib/vendor/tom-select/tom-select.min.css: { minified: true, weight: -10 }
      src/tom-select.css: { preprocess: false }
  js:
    lib/vendor/tom-select/tom-select.complete.min.js: { minified: true, preprocess: false, weight: -10 }
    lib/hivelog-filter-select.js: {}
  dependencies:
    - core/drupal
    - core/once
