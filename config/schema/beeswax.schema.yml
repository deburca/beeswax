beeswax.settings:
  type: theme_settings
  label: "Beeswax settings"
  mapping:
    scheme:
      type: string
      label: Color scheme
      constraints:
        Choice:
          # @see \Drupal\beeswax\Hook\ThemeHooks::themeSettingsFormAlter()
          # `auto` follows the visitor's device (prefers-color-scheme).
          - light
          - dark
          - auto
    footer_contact:
      type: string
      requiredKey: false
      label: Footer contact (an email address or web address)
    footer_app_url:
      type: string
      requiredKey: false
      label: Footer app link (a web address)
    footer_menu:
      type: string
      requiredKey: false
      label: Footer menu (machine name)
    footer_copyright:
      type: boolean
      requiredKey: false
      label: Footer copyright line
    footer_credit_name:
      type: string
      requiredKey: false
      label: Footer credit name
    footer_credit_url:
      type: string
      requiredKey: false
      label: Footer credit link (a web address)
