beeswax.settings:
  type: theme_settings
  label: "Beeswax settings"
  mapping:
    scheme:
      type: string
      label: Color scheme
      constraints:
        Choice:
          # @see \Drupal\beeswax\Hook\ThemeHooks::themeSettingsFormAlter()
          # `auto` follows the visitor's device (prefers-color-scheme).
          - light
          - dark
          - auto
