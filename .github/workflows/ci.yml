name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Formatting
        run: npm run format:check

      # Rebuilds build/ and fails if the committed output differs: someone
      # changed a source file (or the toolchain) and did not commit the build.
      - name: Build is up to date
        run: npm run check:build

      - name: PHP syntax
        run: find src -name '*.php' -print0 | xargs -0 -n1 php -l

      # Drupal coding standard (Drupal and DrupalPractice) on the theme's PHP.
      - name: Install Drupal coder
        run: |
          composer global config --no-plugins allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer global require --no-interaction drupal/coder:^8.3
          echo "$(composer global config bin-dir --absolute --quiet)" >> "$GITHUB_PATH"

      - name: PHP coding standard
        run: phpcs --standard=Drupal,DrupalPractice --extensions=php src tests
